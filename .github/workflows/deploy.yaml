name: Deploy Website

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Astro site
        run: pnpm build

      - name: Check deployment secrets
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          HETZNER_REMOTE_PATH: ${{ secrets.HETZNER_REMOTE_PATH }}
        run: |
          test -n "$HETZNER_HOST" || { echo "HETZNER_HOST is missing"; exit 1; }
          test -n "$HETZNER_USER" || { echo "HETZNER_USER is missing"; exit 1; }
          test -n "$HETZNER_SSH_KEY" || { echo "HETZNER_SSH_KEY is missing"; exit 1; }
          test -n "$HETZNER_REMOTE_PATH" || { echo "HETZNER_REMOTE_PATH is missing"; exit 1; }

      - name: Configure SSH key
        env:
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$HETZNER_SSH_KEY" > ~/.ssh/hetzner
          chmod 600 ~/.ssh/hetzner

      - name: Add Hetzner host key
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
        run: |
          ssh-keyscan -p 22 "$HETZNER_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload website
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
          HETZNER_REMOTE_PATH: ${{ secrets.HETZNER_REMOTE_PATH }}
        run: |
          BATCH_FILE="$(mktemp)"

          echo "cd $HETZNER_REMOTE_PATH" >> "$BATCH_FILE"

          # Create every directory from dist/
          find dist -type d | sort | while read -r dir; do
            if [ "$dir" = "dist" ]; then
              continue
            fi

            remote_dir="${dir#dist/}"
            echo "-mkdir $remote_dir" >> "$BATCH_FILE"
          done

          # Upload every file while preserving its relative path
          find dist -type f | sort | while read -r file; do
            remote_file="${file#dist/}"
            echo "put $file $remote_file" >> "$BATCH_FILE"
          done

          sftp \
            -i ~/.ssh/hetzner \
            -P 22 \
            -b "$BATCH_FILE" \
            "$HETZNER_USER@$HETZNER_HOST"
